name: Release

# Push a tag like v0.1.0 to build PgCredsHandler.exe and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test PgCredsHandler.sln -c Release

      # One self-contained file: users download it and double-click, no .NET install needed.
      - name: Publish
        run: >
          dotnet publish src/PgCredsHandler.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish

      - uses: softprops/action-gh-release@v2
        with:
          files: publish/PgCredsHandler.exe
          generate_release_notes: true
